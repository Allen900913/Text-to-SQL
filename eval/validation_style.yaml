# 風格驗證集 —— 照驗收集的**問句風格**出題，不照它的 SQL 形狀出。
#
# 為什麼會有這一組
# ================================================================
# 第一組驗證集（validation_shapes.yaml）抄錯了屬性。我模仿的是驗收集
# 錯題的 SQL 形狀（扇出、零列群組），結果拿 97.3% —— 那組題證明的是
# 我猜錯了成因，不是架構很好。
#
# 量完三組題的統計，難的不是 SQL 是問句：
#     問句長度中位　開發集 20　驗收集 18　驗證集一 37
#     GT 列數中位　　開發集  2　驗收集  5　驗證集一 22
#     WHERE 謂詞　　開發集 .79　驗收集 .44　驗證集一 .60
# 驗證集一的 SQL 比驗收集難（列數 4.4 倍、謂詞更多），問句長一倍，
# 分數高 17.6 個百分點。所以這一組要模仿的是**短、口語、用生活話講概念**，
# 不是模仿 JOIN 結構。
#
# 出題只看 tools/make_data_cards.py 的資料卡（不含任何 schema 註解）——
# 看註解出題等於量「抄得像不像」。
#
# 這組**不封存**，跑完就是要逐題看。界線：
#     驗收集  跑完只看總分　→ eval/testset_run.py
#     驗證集  跑完隨便看　　→ eval/validation_run.py
#
# 事前登記的驗收判準（寫在跑之前）
# ================================================================
# 這組的用途是「重現驗收集的難度、而且可以逐題看」。所以它必須夠難：
#     總分落在驗收集的 95% 區間 72.6% – 86.8% 內 → 重現成功，可以拿來歸因
#     顯著高於 86.8%                            → 沒重現，這組作廢重出
# 分數不是越高越好。這一點跟開發集相反。

