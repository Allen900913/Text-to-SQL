  sql: SELECT p.name, SUM(orr.quantity) AS qty FROM order_returns orr JOIN products p ON p.id = orr.product_id GROUP BY p.id, p.name ORDER BY qty DESC, p.name
  expect: rows

- id: 1097
  question: 用過優惠券的那些單子，平均比沒用的貴還是便宜？
  sql: SELECT CASE WHEN o.id IN (SELECT order_id FROM coupon_redemptions) THEN 'A有用券' ELSE 'B沒用券' END AS used_coupon, AVG(o.total_amount) AS avg_amount, COUNT(*) AS n FROM orders o GROUP BY used_coupon ORDER BY used_coupon
  expect: rows

- id: 1098
  question: 每檔行銷活動被點了幾次？
  sql: SELECT ca.name, COUNT(*) AS n FROM campaign_clicks cc JOIN campaigns ca ON ca.id = cc.campaign_id GROUP BY ca.id, ca.name ORDER BY n DESC, ca.name
  expect: rows

- id: 1099
  question: 送到府的那些貨，平均跑幾趟才成功？依包材分開看。
  sql: SELECT sp.packing_material, AVG(sp.attempt_count) AS avg_attempt FROM shipment_profiles sp JOIN shipments s ON s.id = sp.shipment_id WHERE s.status = 'DELIVERED' GROUP BY sp.packing_material ORDER BY avg_attempt DESC
  expect: rows

- id: 1100
  question: 按照訂單明細實際加總，買最多件的前十位客人是誰？
  sql: SELECT c.name, SUM(oi.quantity) AS qty FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN customers c ON c.id = o.customer_id GROUP BY c.id, c.name ORDER BY qty DESC, c.name LIMIT 10
  expect: rows

- id: 1101
  question: 哪些商品的定價高過它所屬分類的平均價？
  sql: SELECT name, category, price FROM products p WHERE price > (SELECT AVG(price) FROM products x WHERE x.category = p.category) ORDER BY category, price DESC
  expect: rows

- id: 1102
  question: 星等最低的那五樣商品，各拿到幾則評價？
  sql: SELECT p.name, AVG(r.rating) AS avg_rating, COUNT(*) AS n FROM reviews r JOIN products p ON p.id = r.product_id GROUP BY p.id, p.name ORDER BY avg_rating, p.name LIMIT 5
  expect: rows

- id: 1103
  question: 每個經營分群的人，平均開幾張客服單？
  sql: SELECT cp.segment, COUNT(t.id) / COUNT(DISTINCT cp.customer_id) AS avg_tickets FROM customer_profiles cp LEFT JOIN support_tickets t ON t.customer_id = cp.customer_id GROUP BY cp.segment ORDER BY avg_tickets DESC
  expect: rows

