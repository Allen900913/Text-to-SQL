# 形狀驗證集 —— 這組是拿來「看」的，不是拿來封存的。
#
# 為什麼要這組
# ============================================================
# 驗收集 v2 的 29 題 wrong 分桶：列數對值全不合 15、少回列 10、少帶欄位 3、
# 誤觸防禦 1，而「多回列」是 0。檢索層 GT 表進候選 120/121 = 99.2%。
# 所以損失全在生成層的兩種形狀，這組題就只打那兩種：
#
#   zero_group  「每個 X 各多少」而某些 X 是 0 → INNER JOIN 會整組吃掉
#   fanout      一對多 JOIN 之後聚合母表的欄位 → 值被乘上 child 列數
#   control     已經會的形狀（純投影/過濾、子查詢+否定），用來抓回歸
#
# 每題兩份 SQL
# ============================================================
#   sql       正解
#   trap_sql  天真寫法（INNER JOIN／JOIN 完直接 SUM）
#
# 閘門斷言兩者結果**必須不同**。不同才有鑑別力 —— 否則系統答對只是
# 因為那題兩種寫法都對，量不到任何東西。sql 與 trap_sql 同結果的題一律退回。
#
# 出題只看資料（外鍵結構、零列群組計數、扇出倍數），不看任何 schema 註解。

