    \ (ORDER BY s) AS rn, COUNT(*) OVER () AS c FROM t)\nSELECT AVG(s) AS median FROM r WHERE rn IN (FLOOR((c\
    \ + 1) / 2), FLOOR((c + 2) / 2))\n"
