  expect: rows
  sql: |
    SELECT COUNT(DISTINCT customer_id) AS n
    FROM newsletter_subscriptions WHERE unsubscribed_at IS NULL
  note: |
    測 NULL 語意。**這是「訂電子報」不是「付費訂閱方案」** ——
    後者在 subscriptions，是刻意的鑑別對照。

- id: 238
  question: 有多少位客戶退訂了電子報？
  expect: rows
  sql: |
    SELECT COUNT(DISTINCT customer_id) AS n
    FROM newsletter_subscriptions WHERE unsubscribed_at IS NOT NULL

