# =============================================================================
# Ground Truth — eval_questions_v2.json 的預期答案
# =============================================================================
# 為什麼需要這份檔案：
#   完成率（ok / schema_unsupported / error_end）量的是「有沒有跑出東西」，
#   不是「答得對不對」。實測過 95% 完成率的那一輪裡，#25 回了 6 個城市而
#   正確答案是 0 —— retry=0、語法合法、AST 與 EXPLAIN 全部放行的靜默錯答。
#   沒有這份檔案，那種錯誤唯一的發現方式是人工重算，擴表之後就不可能了。
#
# 撰寫原則：
#   1. 刻意走不同的實作路徑。極值題一律用 MIN/MAX 子查詢，而系統偏好
#      DENSE_RANK —— 兩條路徑得到同一個結果才算交叉驗證，照抄系統的寫法
#      只是把它的錯誤複製一遍。
#   2. 金額口徑依「粒度」決定：訂單 / 客戶 / 城市層級用 orders.total_amount；
#      商品 / 類別 / 供應商層級 total_amount 無法拆分到單一維度（200 張訂單有
#      151 張橫跨多個類別，硬算會讓同一張訂單在每個類別各記一次全額），
#      改用 SUM(oi.quantity * oi.unit_price)。
#      （本資料集 200/200 張訂單的 total_amount 與明細加總完全一致，
#        兩式在全庫加總下相等 —— 只有往訂單以下切才發散。）
#      這個口徑原本只有前半句寫在 business_rules，導致 #98 在兩式間擺盪；
#      已改由 semantic_layer 的「各商品類別的總營收」few-shot 完整表達。
#   3. 不排除 CANCELLED 訂單，除非題目明講。規則裡沒有這條約定。
#   4. 相對時間一律以資料錨點 2026-08-15 為基準，不用 NOW() / CURDATE()。
#      理由見 langgraph_sql/data_anchor.py。
#
# 欄位說明：
#   expect: rows                → 預期有結果
#           empty               → 預期 0 筆。包含兩種：刻意設計的「查無資料」
#                                 陷阱題（#73-76），以及正確答案剛好就是空集合
#                                 的一般題（#25）。對系統來說要求相同：誠實回
#                                 報 0 筆，不可硬湊出東西，也不可觸發防禦暗號。
#           schema_unsupported  → schema 根本沒有這個概念，預期觸發防禦暗號
#   sql     主要的預期答案
#   alt_sql 題目本身語意有歧義時，同樣可接受的其他解讀（列表，任一相符即通過）
#   note    記錄該題的解讀決定，或這題在測什麼
#
# ⚠️ 這份檔案綁定 DATA_RANDOM_SEED=20260815 與 DATA_ANCHOR_DATE=2026-08-15。
#    換種子等於換一份資料，所有涉及具體數值的預期答案都要重跑驗證。
#    題目本身也不可硬編資料相依的值 —— 原本 #78 寫「林宜蓁」，那是舊種子
#    隨機生出來的名字，換種子後該客戶就不存在，題目會靜默變成查無資料。
# =============================================================================

- id: 1
  question: 找出名字最後一個字是「華」的客戶有哪些？
  expect: rows
  sql: |
    SELECT name FROM customers WHERE name LIKE '%華' ORDER BY name

