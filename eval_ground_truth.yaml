- id: 138
  question: 有哪些客戶的收件地址城市和自己居住的城市不同？
  expect: rows
  note: 陷阱題。addresses.city 是收件城市、customers.city 是居住城市， 兩個欄位同名但語意不同，必須各自帶表別名比較。 同一位客戶可能有多筆這種地址，故去重。 原本問「收件城市和自己居住的城市不一樣」，系統只比對預設地址
    (is_default=1) 而回 0 筆 —— 本資料集預設地址永遠等於居住城市， 那個讀法必然得 0。改成「留過…的地址」，明確涵蓋全部地址。 ⚠️ 已知未解缺陷（重新凍結，實測 5/16）：系統多數時候回
    48 列 —— 每筆符合條件的地址一列， 沒有對客戶收斂。加了「哪些客戶買過機械鍵盤」這個去重 few-shot 後仍是 1/6， 結構級的教訓沒有跨領域遷移（對照：is_deleted 那種謂詞級教訓
    2/4 → 6/6）。 2026-08 解凍再試：補上缺口形狀「子表欄位 vs 母表欄位」的 few-shot （o.order_date < c.created_at）。1/14 → 5/16，Fisher
    p=0.116 不顯著； 錯誤形狀從「未收斂 48 列」移向「收斂到姓名 29 列」。剩下的障礙是 「收斂鍵用 id 不用 name」，那已有專門 few-shot 教過而未生效。 **重新凍結**，理由見
    ARCHITECTURE.md §4.1 / §6。 三次改寫各自失敗一種：只比對預設地址(0 列) / 逐筆列地址(48 列) / 用「寄到」當動詞會誤觸防禦暗號(4/6)。措辭已定稿，不再調整
    —— 再調就是在教模型考題，而不是修能力。 ⚠️ 原本 GT 寫 SELECT DISTINCT c.name 得 29 列，那是錯的：符合條件的是 34 位客戶，但其中有同名不同人（李家豪/林柏翰/李柏翰/王建國/謝俊傑
    各有兩位），DISTINCT name 會把他們併成一列。改用 GROUP BY c.id, c.name。
  sql: 'SELECT c.name FROM addresses a JOIN customers c ON a.customer_id = c.id

    WHERE a.city <> c.city GROUP BY c.id, c.name ORDER BY c.name

    '
