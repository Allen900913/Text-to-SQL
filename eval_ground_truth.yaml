  sql: "WITH per_cust AS (\n  SELECT c.city AS ct, c.id AS cid, SUM(o.total_amount) AS spent\n  FROM customers\
    \ c JOIN orders o ON c.id = o.customer_id\n  GROUP BY c.city, c.id),\nper_city AS (SELECT ct, AVG(spent)\
