- id: 255
  question: 列出有申請過保固的商品名稱與申請次數。
  expect: rows
  sql: |
    SELECT p.name, COUNT(*) AS n
    FROM warranty_claims w JOIN products p ON p.id = w.product_id
    GROUP BY p.id, p.name
    ORDER BY p.name
  note: |
    原本寫 `ordered: true` 且「由多到少排序」，改掉了 —— 24 個商品裡大量
    並列 1 次，名次相同時的先後是任意的，那會變成在考排序的巧合而不是 SQL。

- id: 256
  question: 有哪些客戶既預約過到店服務，也建立過保固申請？列出姓名。
  expect: rows
  sql: |
    SELECT c.name FROM customers c
    WHERE EXISTS (SELECT 1 FROM service_appointments a WHERE a.customer_id = c.id)
      AND EXISTS (SELECT 1 FROM warranty_claims w
                  JOIN orders o ON o.id = w.order_id
                  WHERE o.customer_id = c.id)
    GROUP BY c.id, c.name ORDER BY c.name
  note: |
    warranty_claims 沒有 customer_id，必須經由 orders 才連得到客戶 ——
    這一題測的就是「橋接表要靠外鍵結構找，不是靠語意」（KMB 的存在理由）。

- id: 257
  question: 每間門市各有幾筆到店服務預約？
  expect: rows
  sql: |
    SELECT s.name, COUNT(*) AS n
    FROM service_appointments a JOIN stores s ON s.id = a.store_id
    GROUP BY s.id, s.name ORDER BY s.name
