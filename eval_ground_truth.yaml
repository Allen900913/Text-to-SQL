- id: 30
  question: 哪一個城市的客戶平均消費金額最高？
  expect: rows
  note: 主解讀 =「每位客戶的總消費，再對城市取平均」。
        alt =「該城市的平均單筆訂單金額」，兩種都是常見讀法。
  sql: |
    WITH per_cust AS (
      SELECT c.city AS ct, c.id AS cid, SUM(o.total_amount) AS spent
      FROM customers c JOIN orders o ON c.id = o.customer_id
      GROUP BY c.city, c.id),
    per_city AS (SELECT ct, AVG(spent) AS a FROM per_cust GROUP BY ct)
    SELECT ct, a FROM per_city WHERE a = (SELECT MAX(a) FROM per_city)
  alt_sql:
    - |
      WITH t AS (SELECT c.city AS ct, AVG(o.total_amount) AS a FROM customers c
                 JOIN orders o ON c.id = o.customer_id GROUP BY c.city)
      SELECT ct, a FROM t WHERE a = (SELECT MAX(a) FROM t)

