- id: 83
  question: 客戶從註冊到第一次下單，平均間隔多久？
  expect: rows
  note: 單位為天。只計算有下過訂單的客戶。
        ⚠️ 本資料集 49 位有訂單的客戶裡，有 20 位的首單早於註冊時間
        （seed 時 created_at 與 order_date 是獨立亂數，沒有先後約束）。
        負值區間 DATEDIFF 與 TIMESTAMPDIFF(DAY) 的截斷方向不同，
        20/49 ≈ 0.41 天，恰好就是兩者的差（22.08 vs 22.47），兩種都接受。
        真正該修的是資料而不是 GT —— 擴充 schema 時應讓 order_date
        必定晚於 created_at，這題才測得出東西。
  sql: |
    SELECT AVG(DATEDIFF(f.first_order, c.created_at)) AS avg_days
    FROM customers c JOIN (
      SELECT customer_id, MIN(order_date) AS first_order FROM orders GROUP BY customer_id
    ) f ON c.id = f.customer_id
  alt_sql:
    - |
      SELECT AVG(TIMESTAMPDIFF(DAY, c.created_at, f.first_order)) AS avg_days
      FROM customers c JOIN (
        SELECT customer_id, MIN(order_date) AS first_order FROM orders GROUP BY customer_id
      ) f ON c.id = f.customer_id

