- id: 17
  question: 請先算出所有商品的平均單價，再從單價高於該平均值的商品中，找出庫存最少的是哪一個？
  expect: rows
  note: 極值 + 前置過濾 + 非聚合欄位。系統慣性會寫 ORDER BY stock LIMIT 1，
        會被 AST 的極值截斷檢查攔下並重試。
  sql: |
    SELECT name, stock FROM products
    WHERE price > (SELECT AVG(price) FROM products)
      AND stock = (SELECT MIN(stock) FROM products
                   WHERE price > (SELECT AVG(price) FROM products))
    ORDER BY name

