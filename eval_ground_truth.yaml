- id: 20
  question: 找出每一張訂單都是 COMPLETED 狀態的客戶。
  expect: rows
  note: 全稱量詞。解讀為「至少下過一張訂單，且全部都是 COMPLETED」——
        沒下過訂單的客戶雖然空真，但不符合自然語意。
  sql: |
    SELECT c.name FROM customers c JOIN orders o ON c.id = o.customer_id
    GROUP BY c.id, c.name
    HAVING SUM(CASE WHEN o.status <> 'COMPLETED' THEN 1 ELSE 0 END) = 0
    ORDER BY c.name

