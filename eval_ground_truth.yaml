- id: 242
  question: 站內搜尋最熱門的關鍵字是哪一個？被搜尋了幾次？
  expect: rows
  sql: |
    SELECT keyword, COUNT(*) AS n FROM search_logs
    GROUP BY keyword
    HAVING COUNT(*) = (SELECT MAX(c) FROM (SELECT COUNT(*) AS c FROM search_logs
                       GROUP BY keyword) x)
  note: |
    掃地機器人 57 次，第二名 54，沒有平手。
    **搜尋不是瀏覽** —— 瀏覽紀錄在 browse_logs，是刻意的鑑別對照。

- id: 243
  question: 有幾次站內搜尋沒有搜到任何結果？
  expect: rows
  sql: |
    SELECT COUNT(*) AS n FROM search_logs WHERE result_count = 0

- id: 244
  question: 系統總共建立了幾筆商品推薦關聯？
  expect: rows
  sql: |
    SELECT COUNT(*) AS n FROM product_recommendations
  note: |
    **這是演算法推薦，不是實際的共同購買** ——
    「最常一起被購買」要走 order_items（見 #81），是刻意的鑑別對照。

- id: 245
  question: 商品「iPhone 15」被推薦了哪些商品？依推薦排序列出。
  expect: rows
  ordered: true
  sql: |
    SELECT rp.name
    FROM product_recommendations r
    JOIN products p ON p.id = r.product_id
    JOIN products rp ON rp.id = r.recommended_product_id
    WHERE p.name = 'iPhone 15'
    ORDER BY r.rank_no
  note: 自我參照的兩次 JOIN products，一次當來源、一次當被推薦。

- id: 246
  question: 常見問題文章各分類有幾篇？
  expect: rows
  sql: |
    SELECT category, COUNT(*) AS n
    FROM faq_articles GROUP BY category ORDER BY category
  note: 原本想問「文章最多的分類」，實測五個分類全部並列 4 篇。

- id: 247
