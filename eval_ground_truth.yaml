        carts + cart_items，絕不能因為問的是「商品」就跑去 order_items。
  sql: |
    WITH t AS (
      SELECT ci.product_id AS pid, COUNT(*) AS n
      FROM cart_items ci JOIN carts c ON ci.cart_id = c.id
      WHERE c.is_abandoned = 1 GROUP BY ci.product_id)
    SELECT p.name, t.n FROM t JOIN products p ON t.pid = p.id
    WHERE t.n = (SELECT MAX(n) FROM t) ORDER BY p.name

