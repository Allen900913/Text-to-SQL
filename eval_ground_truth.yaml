    既然說了「列出…名稱」，筆數就不再是合法答案，COUNT 那條 alt 留著會讓
    一個明確要名單的題目仍然接受一個數字，那是自相矛盾的 GT。

    過期基準用資料錨點 2026-08-15，不用 CURDATE()。

