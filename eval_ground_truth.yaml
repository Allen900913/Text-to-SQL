# =============================================================================
# #101-141 — 擴充 schema（17 張新表）的覆蓋題組
# =============================================================================
# 為什麼補這一組：
#   #1-100 全部只需要 customers / products / orders / order_items 四張表。
#   擴到 21 張表之後量到「正確率不掉」，但那只證明了「無關的表不會干擾」，
#   完全沒證明「該用新表時會不會挑對」。這 41 題就是補這個缺口。
#
# 這組刻意壓在 init_db_ext.py 埋的陷阱上：
#   - status 四種值域（orders / payments / shipments / refunds 意義都不同）
#   - 時間鏈 order_date → paid_at → shipped_at → delivered_at
#   - 語意捷徑：browse_logs 是「看過」、cart_items 是「想買」，都不是「買了」
#   - 同名欄位：suppliers.city 不是 customers.city、addresses.city 也不是
#   - 分類雙表示：products.category（字串）vs categories/product_categories（表）
#   - 寬表 product_specs 的 NULL 是「不適用」不是「未知」
# =============================================================================

