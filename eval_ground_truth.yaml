  question: 有幾個商品規格變體被設為預設？
  expect: rows
  sql: |
    SELECT COUNT(*) AS n FROM product_variants WHERE is_default = 1

- id: 234
  question: 總共登錄了幾組商品條碼？
  expect: rows
  sql: |
    SELECT COUNT(*) AS n FROM variant_barcodes

- id: 235
  question: 有哪些規格變體登錄了超過一組條碼？列出變體編號與條碼數。
  expect: rows
  sql: |
    SELECT variant_id, COUNT(*) AS n
    FROM variant_barcodes GROUP BY variant_id HAVING COUNT(*) > 1
    ORDER BY variant_id

- id: 236
  question: 總共寄出了幾期電子報？
  expect: rows
  sql: |
    SELECT COUNT(*) AS n FROM newsletters
  note: 電子報是群發信；購物車挽回信在 cart_recovery_emails，兩者不同。

- id: 237
