- id: 305
  question: 掛在首頁橫幅、而且結帳時自動套用的檔期有哪幾檔？啟用停用都算。各自的最低訂單門檻與單筆折抵上限是多少？用到這些檔期的訂單，各自來自哪些流量來源、各有幾張？
  expect: rows
  sql: "SELECT p.name, pp.min_order_amount, pp.max_discount_amount, op.utm_source,\n       COUNT(DISTINCT\
    \ o.id) AS order_count\nFROM promotion_profiles pp\nJOIN promotions p ON p.id = pp.promotion_id\n\
    JOIN order_promotions o2p ON o2p.promotion_id = pp.promotion_id\nJOIN orders o ON o.id = o2p.order_id\n\
    JOIN order_profiles op ON op.order_id = o.id\nWHERE pp.display_slot = 'HOME_TOP' AND pp.is_auto_applied\
    \ = 1\nGROUP BY p.name, pp.min_order_amount, pp.max_discount_amount, op.utm_source\n"
  note: '雙寬表題，走 order_promotions 這條真實外鍵路徑（promotions 與 campaigns 之間沒有外鍵，所以不用「同期」那種日期比對）。

    2026-08-25 補 alt_sql：稽核把「模型只用 4 張表、沒用 orders」標成僥倖候選，實測**不是僥倖**——
    order_promotions.order_id 與 order_profiles.order_id 都指向 orders.id，且 order_promotions
    沒有孤兒列（0 筆），所以 orders 在這一題純屬穿透，直接接起來輸出完全相同（兩式都 10 列、逐列相同）。
    鑑別力也不受影響：只查到其中一檔仍然只有 5 列。**這是承認一條等價的較短路徑，不是放寬 GT。**


    2026-08-25 第一次改寫，修掉**僥倖漏洞**：原 GT 是 DISTINCT(utm_source, 門檻, 上限)，只有 5 列；

    但符合條件的兩檔（春季購物節、滿額折抵）門檻完全相同（500/200）、流量來源集合也完全相同 ——

    **模型只查到其中一檔，會拿到一模一樣的 5 列而過關。**加上活動名稱後變 10 列，實測少查一檔掉到 5 列，一定被抓到。


    2026-08-25 第二次改寫，修掉**形狀歧義**：只問「來自哪些流量來源」時，「每個來源一列」與

    「每檔一列、來源用逗號併起來」都是合法答案（實測 8 次裡有 4 次用 GROUP_CONCAT）。

    加問「各有幾張」之後，逐格指標把粒度釘死 —— **這是問句層的修正，不是把 GT 放寬去迎合模型輸出。**

    promotions.name 在本資料集唯一（8/8），可安全當識別欄位。

    '
  alt_sql:
  - 'SELECT p.name, pp.min_order_amount, pp.max_discount_amount, op.utm_source,
    COUNT(DISTINCT o2p.order_id) AS order_count FROM promotion_profiles pp
    JOIN promotions p ON p.id = pp.promotion_id
    JOIN order_promotions o2p ON o2p.promotion_id = pp.promotion_id
    JOIN order_profiles op ON op.order_id = o2p.order_id
    WHERE pp.display_slot = ''HOME_TOP'' AND pp.is_auto_applied = 1
    GROUP BY p.name, pp.min_order_amount, pp.max_discount_amount, op.utm_source

    '
  - "SELECT pp.promotion_id, pp.min_order_amount, pp.max_discount_amount, op.utm_source,\n       COUNT(DISTINCT\
    \ o.id) AS order_count\nFROM promotion_profiles pp\nJOIN order_promotions o2p ON o2p.promotion_id\
    \ = pp.promotion_id\nJOIN orders o ON o.id = o2p.order_id\nJOIN order_profiles op ON op.order_id =\
    \ o.id\nWHERE pp.display_slot = 'HOME_TOP' AND pp.is_auto_applied = 1\nGROUP BY pp.promotion_id, pp.min_order_amount,\
    \ pp.max_discount_amount, op.utm_source\n"
