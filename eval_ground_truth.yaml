    舊問句「有沒有商品的安全認證其實已經過期了？」六輪 3/6，三次失敗是**兩種不同的形狀**：

    · 一次回布林 `SELECT EXISTS(...)` → 1 列。note 列舉了名單與筆數兩種，模型給第三種。
    · 兩次回 `pp.product_id, pp.name_en, pp.safety_cert_expiry` → 列數對、欄位全錯。
