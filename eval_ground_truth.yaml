- id: 25
  question: 有哪些城市的客戶從來沒有買過「家電」類商品？
  expect: empty
  note: 群組全稱量詞。主體是「城市」，條件要求該市『全部』客戶都沒買過。 寫成對單一客戶 NOT EXISTS 再 DISTINCT city，得到的是「該市有某位 客戶沒買過」，語意完全相反。
    正確答案是 0 筆（8 個城市每一個都至少有一位家電買家），這不是陷阱題， 是這題的真實答案。實測錯誤寫法會回 6 個城市 —— 恰好是「買過家電的 人數 < 該市總人數」的那幾個，語法完全合法、retry=0，
    AST 與 EXPLAIN 都攔不到。這題是整份 GT 存在的理由。
  sql: "SELECT DISTINCT city FROM customers WHERE city NOT IN (\n  SELECT c.city FROM customers c\n  JOIN\
    \ orders o ON c.id = o.customer_id\n  JOIN order_items oi ON o.id = oi.order_id\n  JOIN products p\
    \ ON oi.product_id = p.id\n  WHERE p.category = '家電')\nORDER BY city\n"
