# 留下的極值題確認唯一：最熱關鍵字 掃地機器人 57（第二名 54）
#
# 這一波的近義鑑別對照：
#   search_logs vs browse_logs              「搜尋」不是「瀏覽」
#   newsletter_subscriptions vs subscriptions 「訂電子報」不是「付費訂閱」
#   campaigns vs promotions                 「廣告投放」不是「站上折扣檔期」
#   faq_votes vs reviews                    「文章投票」不是「商品評價」
#   warranty_claims vs order_returns        「保固維修」不是「退貨」
#   service_appointments vs store_pickups   「到店服務預約」不是「到店取貨」
#   product_recommendations vs order_items  「演算法推薦」不是「實際共同購買」
#   warehouse_staff vs store_staff          倉庫人力不是門市人力
# =============================================================================

- id: 226
  question: 每個倉庫各配置了幾位員工？
  expect: rows
  sql: |
    SELECT w.name, COUNT(*) AS n
    FROM warehouse_staff s JOIN warehouses w ON w.id = s.warehouse_id
    GROUP BY w.id, w.name ORDER BY w.name
  note: 原本想問「人力最多的倉庫」，實測三個倉庫並列 3 人，改成分組。

- id: 227
  question: 有多少位員工被派駐在倉庫？
  expect: rows
  sql: |
    SELECT COUNT(DISTINCT employee_id) AS n FROM warehouse_staff
  note: 問「幾位員工」要去重 —— 一位員工可能派駐多個倉庫。

- id: 228
  question: 每間門市各配置了幾位員工？
  expect: rows
  sql: |
    SELECT s.name, COUNT(*) AS n
    FROM store_staff x JOIN stores s ON s.id = x.store_id
    GROUP BY s.id, s.name ORDER BY s.name
  note: 門市人力是 store_staff，倉庫人力在 warehouse_staff，兩張表不可互換。

- id: 229
  question: 有哪些員工同時被派駐在倉庫和門市？列出姓名。
  expect: rows
  sql: |
    SELECT e.name FROM employees e
    WHERE EXISTS (SELECT 1 FROM warehouse_staff w WHERE w.employee_id = e.id)
      AND EXISTS (SELECT 1 FROM store_staff s WHERE s.employee_id = e.id)
    GROUP BY e.id, e.name ORDER BY e.name
  note: 兩個 EXISTS 交集，主體是員工要收斂（§10.9）。同時碰兩張新表。

- id: 230
  question: 員工班表的各種班別各排了幾班？
  expect: rows
  sql: |
    SELECT shift_type, COUNT(*) AS n
    FROM employee_shifts GROUP BY shift_type ORDER BY shift_type

- id: 231
  question: 排定的總工時是多少小時？
  expect: rows
  sql: |
    SELECT SUM(hours) AS h FROM employee_shifts

