- id: 89
  question: 訂單張數最多的前 5 位客戶，各自的訂單狀態分布是什麼？
  expect: rows
  note: 原本寫「列出前 5 位客戶」但沒說依什麼排序，實測系統每輪的解讀都不同
        （52 列的長格式、16 列的樞紐格式），題目本身測不出東西，已改寫成
        明確以訂單張數排序。
        MySQL 不支援 IN 子查詢帶 LIMIT（error 1235），故改用衍生表 JOIN。
  sql: |
    SELECT c.name, o.status, COUNT(*) AS n
    FROM customers c
    JOIN orders o ON c.id = o.customer_id
    JOIN (SELECT customer_id FROM orders GROUP BY customer_id
          ORDER BY COUNT(*) DESC, customer_id LIMIT 5) top
      ON top.customer_id = c.id
    GROUP BY c.id, c.name, o.status ORDER BY c.name, o.status
  alt_sql:
    - |
      SELECT c.name,
             SUM(o.status = 'PENDING')   AS pending_n,
             SUM(o.status = 'PAID')      AS paid_n,
             SUM(o.status = 'SHIPPED')   AS shipped_n,
             SUM(o.status = 'COMPLETED') AS completed_n,
             SUM(o.status = 'CANCELLED') AS cancelled_n
      FROM customers c
      JOIN orders o ON c.id = o.customer_id
      JOIN (SELECT customer_id FROM orders GROUP BY customer_id
            ORDER BY COUNT(*) DESC, customer_id LIMIT 5) top
        ON top.customer_id = c.id
      GROUP BY c.id, c.name ORDER BY c.name

