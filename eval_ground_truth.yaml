- id: 93
  question: 客戶總消費金額的中位數大約是多少？
  expect: rows
  note: 偶數筆時取中間兩筆的平均。MySQL 沒有 MEDIAN()。
        題目沒說「客戶」是指有消費的客戶、還是全部客戶（有 1 位從未下單，
        其消費額為 0）。兩種讀法都成立，因此主解讀取有消費者，alt_sql 收全體。
  sql: |
    WITH t AS (SELECT SUM(total_amount) AS s FROM orders GROUP BY customer_id),
    r AS (SELECT s, ROW_NUMBER() OVER (ORDER BY s) AS rn, COUNT(*) OVER () AS c FROM t)
    SELECT AVG(s) AS median FROM r WHERE rn IN (FLOOR((c + 1) / 2), FLOOR((c + 2) / 2))
  alt_sql:
    - |
      WITH t AS (SELECT c.id, COALESCE(SUM(o.total_amount), 0) AS s
                 FROM customers c LEFT JOIN orders o ON c.id = o.customer_id
                 GROUP BY c.id),
      r AS (SELECT s, ROW_NUMBER() OVER (ORDER BY s) AS rn, COUNT(*) OVER () AS c FROM t)
      SELECT AVG(s) AS median FROM r WHERE rn IN (FLOOR((c + 1) / 2), FLOOR((c + 2) / 2))

- id: 94
  question: 找出消費金額高於所在城市平均消費的客戶。
  expect: rows
  note: 城市平均 = 該市每位客戶總消費的平均，與 #30 主解讀一致。
  sql: |
    WITH ct AS (SELECT customer_id AS cid, SUM(total_amount) AS t FROM orders GROUP BY 1),
    ca AS (SELECT c.city AS ci, AVG(ct.t) AS a FROM ct
           JOIN customers c ON c.id = ct.cid GROUP BY c.city)
    SELECT c.name FROM ct JOIN customers c ON c.id = ct.cid
    JOIN ca ON c.city = ca.ci WHERE ct.t > ca.a ORDER BY c.name

