# =============================================================================
# #160-171 — 把 19 張「零 GT 覆蓋」的表拉回訊號（ARCHITECTURE.md §10.1）
# -----------------------------------------------------------------------------
# 為什麼補這批：干擾不是表的屬性，是「表 × 題目集」的屬性。這些表在 155 題裡
# 一次都沒當過正確答案，等於檢索器只要學會「這 19 張永遠別選」就能拿滿分 ——
# 那是評估的漏洞，現實中沒有這種捷徑。補題之後它們才變成「有時是答案、有時
# 是干擾」的真實表，相似度層才第一次被要求撈出它沒撈過的東西。
#
# 撰寫時實測到的兩個地雷（先驗證 GT 再測試，所以沒有寫進去）：
#   - support_tickets 36 張單分屬 36 位不同客戶，「工單最多的客戶」全是 1，
#     order_returns 的退回數量前五名全部並列 3 —— 兩題極值都會變成任意平手。
#   - customers 有同名不同人（37 個 id 對 33 個名字），#169 因此問「幾位客戶」
#     而不是列名字，否則 33 與 37 兩種答案都說得通。
# 不含歧義誘餌：payments.status 只有 SUCCESS 一種值，失敗只存在於
# payment_attempts.result，所以「刷卡失敗」指向唯一一張表。
# =============================================================================

