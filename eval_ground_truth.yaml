- id: 4
  question: 新北市的客戶，平均每個人下了幾張訂單？
  expect: rows
  note: 分母取「該市全部客戶」（含 0 張訂單者），故用 LEFT JOIN。
        alt 是只算「有下過訂單的客戶」。
  sql: |
    SELECT COUNT(o.id) / COUNT(DISTINCT c.id) AS avg_orders
    FROM customers c LEFT JOIN orders o ON c.id = o.customer_id
    WHERE c.city = '新北市'
  alt_sql:
    - |
      SELECT COUNT(o.id) / COUNT(DISTINCT c.id) AS avg_orders
      FROM customers c JOIN orders o ON c.id = o.customer_id
      WHERE c.city = '新北市'

- id: 5
  question: 高雄市的客戶總共消費了多少錢？
  expect: rows
  sql: |
    SELECT SUM(o.total_amount) AS total
    FROM customers c JOIN orders o ON c.id = o.customer_id
    WHERE c.city = '高雄市'

- id: 6
  question: 哪一個商品的總營收最低？總共只賺了多少錢？
  expect: rows
  note: 本資料集 40 項商品全部有銷售紀錄，不存在「營收 0」的未售商品，
        因此含不含未售商品沒有差別。
  sql: |
    WITH rev AS (
      SELECT p.name AS n, SUM(oi.quantity * oi.unit_price) AS r
      FROM products p JOIN order_items oi ON p.id = oi.product_id
      GROUP BY p.id, p.name)
    SELECT n, r FROM rev WHERE r = (SELECT MIN(r) FROM rev)

- id: 7
  question: 哪一個商品類別的總營收最高？
  expect: rows
  sql: |
    WITH c AS (
      SELECT p.category AS ct, SUM(oi.quantity * oi.unit_price) AS r
      FROM order_items oi JOIN products p ON oi.product_id = p.id
      GROUP BY p.category)
    SELECT ct, r FROM c WHERE r = (SELECT MAX(r) FROM c)

- id: 8
