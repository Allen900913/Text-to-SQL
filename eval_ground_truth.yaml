- id: 51
  question: 把商品依單價分成「1000 元以下」「1000 到 10000 元」「10000 元以上」三組，各有幾種商品？
  expect: rows
  note: 邊界解讀：< 1000 / 1000~10000（含端點）/ > 10000。
  sql: |
    SELECT CASE WHEN price < 1000 THEN '1000元以下'
                WHEN price <= 10000 THEN '1000到10000元'
                ELSE '10000元以上' END AS grp,
           COUNT(*) AS n
