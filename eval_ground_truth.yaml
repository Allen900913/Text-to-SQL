- id: 6
  question: 哪一個商品的總營收最低？總共只賺了多少錢？
  expect: rows
  note: 本資料集 40 項商品全部有銷售紀錄，不存在「營收 0」的未售商品， 因此含不含未售商品沒有差別。
  sql: "WITH rev AS (\n  SELECT p.name AS n, SUM(oi.quantity * oi.unit_price) AS r\n  FROM products p\
    \ JOIN order_items oi ON p.id = oi.product_id\n  GROUP BY p.id, p.name)\nSELECT n, r FROM rev WHERE\
    \ r = (SELECT MIN(r) FROM rev)\n"
