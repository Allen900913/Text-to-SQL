- id: 99
  question: 有多少客戶在註冊後 30 天內就下了第一張訂單？
  expect: rows
  note: 0 <= DATEDIFF <= 30。首單早於註冊者（seed 產生的負值）不計入。
  sql: |
    SELECT COUNT(*) AS n FROM customers c JOIN (
      SELECT customer_id, MIN(order_date) AS first_order FROM orders GROUP BY customer_id
    ) f ON c.id = f.customer_id
