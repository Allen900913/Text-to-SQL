tables:
  addresses:
    clauses:
    - kind: content
      text: 客戶地址簿：客戶登記的收件地址，一個客戶可有多筆
      sep: 。
    - kind: bound
      text: 收件人可能不是客戶本人，收件城市也可能與居住城市不同
      sep: ''
    columns:
      id: 地址唯一ID
      customer_id: 所屬客戶ID
      recipient_name: 收件人姓名（可能不是客戶本人）
      phone: 收件人電話
      city: 收件城市
      district: 收件行政區
      street: 收件詳細地址
      is_default: 是否為預設地址
      created_at: 地址建立時間
  api_request_logs:
    clauses:
    - kind: content
      text: API 請求日誌：每個對外 API 呼叫的路徑、狀態碼與耗時
      sep: 。
    - kind: content
      text: 系統維運用
      sep: ，
    - kind: bound
      text: 不是業務資料
      sep: ''
    columns:
      id: 請求唯一ID
      path: 請求路徑
      status_code: HTTP 狀態碼
      duration_ms: 耗時毫秒
      requested_at: 請求時間
  audit_log:
    clauses:
    - kind: content
      text: 系統稽核軌跡：誰在什麼時候動了哪一筆資料
      sep: 。
    - kind: content
      text: 系統維運用
      sep: ，
    - kind: bound
      text: 不是業務資料
      sep: ''
    columns:
      id: 稽核唯一ID
      table_name: 被異動的表名
      row_id: 被異動的資料列ID
      action: 動作
      actor: 執行者帳號
      occurred_at: 發生時間
    enums:
      action:
        description: 動作
        values:
          DELETE: ''
          INSERT: ''
          UPDATE: ''
      table_name:
        description: 被異動的表名
        values:
          customers: ''
          orders: ''
          payments: ''
          products: ''
          shipments: ''
  browse_logs:
    clauses:
    - kind: bound
      text: 商品瀏覽紀錄（看過不等於買過）
      sep: ''
    columns:
      id: 瀏覽紀錄唯一ID
      customer_id: 瀏覽者客戶ID
      product_id: 被瀏覽的商品ID
      viewed_at: 瀏覽時間
      duration_sec: 停留秒數
      source: 流量來源
    enums:
      source:
        description: 瀏覽的流量來源
        values:
          SEARCH: 站內搜尋
          RECOMMEND: 推薦版位
          CATEGORY: 分類瀏覽
          AD: 廣告導入
  cache_entries:
    clauses:
    - kind: content
      text: 快取項目：應用層快取的鍵與到期時間
      sep: 。
    - kind: content
      text: 系統自動維護
      sep: ，
    - kind: bound
      text: 不是業務資料
      sep: ''
    columns:
      id: 快取唯一ID
      cache_key: 快取鍵
      expires_at: 到期時間
      hit_count: 命中次數
  campaign_clicks:
    clauses:
    - kind: content
      text: 廣告點擊紀錄：哪位客戶點了哪個活動的廣告
      sep: 。
    - kind: bound
      text: 點擊不是購買
      sep: ，
    - kind: content
      text: 銷售請看 order_items
      sep: ''
    columns:
      id: 點擊唯一ID
      campaign_id: 活動ID
      customer_id: 客戶ID，未登入為空
      clicked_at: 點擊時間
  campaign_profiles:
    clauses:
    - kind: content
      text: 行銷活動檔案寬表：投放預算與花費、受眾鎖定與版位設定、 素材與 A/B 分組、曝光點擊轉換等成效數字、負責人與審核
      sep: 。
    - kind: facet
      text: ' 這是廣告投放的設定與成效'
      sep: ，
    - kind: ptr
      text: 活動名稱與期間在 campaigns
      sep: 。
    columns:
      id: 流水號
      campaign_id: 對應的行銷活動
      budget_total: 活動總預算金額
      budget_daily: 每日預算上限
      spend_total: 實際投放花費總額
      spend_pacing_pct: 花費進度百分比，實際花費佔總預算
      bid_strategy: 出價策略：單次點擊／千次曝光／單次行動
      bid_amount: 出價金額
      currency_code: 投放幣別
      audience_name: 受眾包名稱
      audience_size: 受眾包人數規模
      target_age_min: 鎖定最小年齡
      target_age_max: 鎖定最大年齡
      target_gender: 鎖定性別
      target_cities: 鎖定城市，以逗號分隔
      target_interests: 鎖定興趣標籤
      exclude_existing_customers: 是否排除既有客戶
      placement: 投放版位：動態／限動／搜尋／聯播網
      device_target: 鎖定裝置
      creative_type: 素材型式：圖片／影片／輪播
      creative_count: 使用的素材件數
      creative_updated_at: 素材最後更新時間
      headline_text: 廣告主標題文案
      cta_text: 行動呼籲按鈕文字
      landing_url: 廣告導向的落地頁網址
      ab_test_group: A/B 測試分組
      ab_test_variable: A/B 測試變因說明
      impressions: 曝光次數
      clicks: 點擊次數
      ctr_pct: 點擊率百分比
      reach: 觸及不重複人數
      frequency: 平均每人看到幾次
      video_views: 影片觀看次數，非影片素材為 0
      video_completion_pct: 影片完整看完的百分比
      conversions: 轉換次數
      conversion_rate_pct: 轉換率百分比
      add_to_cart_count: 由此活動帶來的加入購物車次數
      bounce_rate_pct: 落地頁跳出率百分比
      avg_session_seconds: 落地頁平均停留秒數
      owner_name: 活動負責人
      agency_name: 委外代理商名稱，自操為 NULL
      approved_by: 預算核准人
      approved_at: 預算核准時間
      is_paused: 是否已暫停投放
      paused_reason: 暫停原因
      created_at: 建檔時間
    enums:
      bid_strategy:
        description: 出價策略
        values:
          CPA: 單次行動
          CPC: 單次點擊
          CPM: 千次曝光
      creative_type:
        description: 素材型式
        values:
          CAROUSEL: 輪播
          IMAGE: 圖片
          VIDEO: 影片
      target_gender:
        description: 鎖定性別
        values:
          ALL: ''
          F: ''
          M: ''
      device_target:
        description: 鎖定裝置
        values:
          ALL: ''
          DESKTOP: ''
          MOBILE: ''
      ab_test_group:
        description: A/B 測試分組
        values:
          A: A 組
          NONE: 未參加 A/B 測試
      placement:
        description: 投放版位
        values:
          DISPLAY: 聯播網
          FEED: 動態
          SEARCH: 搜尋
          STORY: 限動
      currency_code:
        description: 投放幣別
        values:
          TWD: ''
  campaigns:
    clauses:
    - kind: content
      text: 行銷活動：廣告投放的活動名稱、渠道與期間
      sep: 。
    - kind: facet
      text: 這是廣告活動
      sep: ，
    - kind: ptr
      text: 站上折扣檔期在 promotions
      sep: ''
    columns:
      id: 活動唯一ID
      name: 活動名稱
      channel: 投放渠道
      started_at: 開始日期
      ended_at: 結束日期
    enums:
      channel:
        description: 投放渠道
        values:
          DISPLAY: ''
          EMAIL: ''
          SEARCH: ''
          SOCIAL: ''
  cart_items:
    clauses:
    - kind: bound
      text: 購物車明細（放入不等於購買）
      sep: ''
    columns:
      id: 購物車明細唯一ID
      cart_id: 所屬購物車ID
      product_id: 商品ID
      quantity: 放入數量（尚未購買）
      added_at: 加入購物車的時間
  cart_recovery_emails:
    clauses:
    - kind: content
      text: 購物車挽回信：對放棄購物車的客戶寄出的提醒信與開信結果
      sep: ''
    columns:
      id: 寄送紀錄唯一ID
      cart_id: 對應購物車ID
      sent_at: 寄送時間
      opened: 是否開信
      clicked: 是否點擊
  carts:
    clauses:
    - kind: bound
      text: 購物車表（尚未結帳，與訂單無關）
      sep: ''
    columns:
      id: 購物車唯一ID
      customer_id: 所屬客戶ID
      is_abandoned: 是否為已放棄的購物車
      created_at: 購物車建立時間
      updated_at: 最後異動時間
  categories:
    clauses:
    - kind: content
      text: 商品分類表（正規化版本；products.category 是反正規化的字串欄位）
      sep: ''
    columns:
      id: 分類唯一ID
      name: 分類名稱
      parent_id: 上層分類ID，NULL 表示最上層
      sort_order: 同層顯示順序
      is_active: 是否啟用中
  coupon_redemptions:
    clauses:
    - kind: content
      text: 優惠券使用紀錄：哪位客戶在哪張訂單用了哪張券
      sep: 。
    - kind: ptr
      text: 券本身在 coupons，檔期折扣在 order_promotions
      sep: ''
    columns:
      id: 使用紀錄唯一ID
      coupon_id: 使用的優惠券ID
      customer_id: 使用的客戶ID
      order_id: 使用在哪張訂單，可為空
      redeemed_at: 使用時間
  coupons:
    clauses:
    - kind: content
      text: 優惠券主檔：券碼、折抵金額與有效期間
      sep: 。
    - kind: facet
      text: 這是可輸入的券碼
      sep: ，
    - kind: bound
      text: 與 promotions 檔期活動不同
      sep: ''
    columns:
      id: 優惠券唯一ID
      code: 優惠券代碼
      discount_amount: 折抵金額
      valid_from: 生效日
      valid_to: 失效日
  customer_contacts:
    clauses:
    - kind: content
      text: 客戶聯絡方式：客戶登記的其他電話與信箱
      sep: 。
    - kind: ptr
      text: 主要聯絡方式在 customers
      sep: ''
    columns:
      id: 聯絡方式唯一ID
      customer_id: 所屬客戶ID
      contact_type: 類型
      contact_value: 聯絡內容
      is_verified: 是否已驗證
    enums:
      contact_type:
        description: 類型
        values:
          EMAIL: ''
          LINE: ''
          PHONE: ''
  customer_login_logs:
    clauses:
    - kind: content
      text: 客戶登入紀錄：每次登入留一筆，含失敗
      sep: 。
    - kind: ptr
      text: 最近一次登入時間在 customer_profiles.last_login_at
      sep: ''
    columns:
      id: 登入紀錄唯一ID
      customer_id: 登入的客戶ID
      logged_in_at: 登入時間
      ip: 來源IP，非業務欄位
      success: 是否登入成功
  customer_profiles:
    clauses:
    - kind: content
      text: 客戶檔案寬表：客戶的人口統計、行銷偏好與同意設定、會員等級與分群、流失風險與終身價值分數，會員系統的註冊與最近活動時間，以及每日結算的消費統計快照
      sep: 。
    - kind: content
      text: 帳號狀態旗標（Email 驗證、黑名單、員工、VIP）、紅利點數與信用額度、推薦來源也在這張表
      sep: 。
    - kind: usage
      text: 想知道客戶輪廓、分級、分群、活躍度或風險就看這張表
      sep: ''
    columns:
      customer_id: 客戶ID
      birth_year: 出生年
      gender: 性別
      occupation: 職業
      education: 教育程度
      marital_status: 婚姻狀態
      household_size: 家庭人數
      district: 行政區，比 customers.city 更細一層
      preferred_language: 偏好語言
      registered_at: 會員系統的註冊時間。與 customers.created_at 是不同系統的紀錄，可能有落差
      first_order_at: 首次下單時間（快照）
      last_order_at: 最近一次下單時間（快照）
      last_login_at: 最近一次成功登入的時間（失敗的嘗試不算；每一次登入含失敗都記在 customer_login_logs）
      last_active_at: 最近一次任何活動時間（登入、瀏覽、加購物車皆算）
      last_cart_at: 最近一次加入購物車時間
      last_review_at: 最近一次留評論時間
      email_verified_at: Email 驗證通過時間，NULL 表示未驗證
      profile_updated_at: 本檔案最後更新時間
      churned_at: 判定流失的時間，NULL 表示未流失
      total_spent: 累計消費金額（每日結算快照，不含最近數日訂單，與即時 SUM(orders.total_amount) 可能不同）
      order_count: 累計訂單數（每日結算快照，與即時 COUNT(orders) 可能不同）
      avg_order_value: 平均訂單金額（快照）
      max_order_value: 最大單筆訂單金額（快照）
      total_items_bought: 累計購買件數（每日結算快照，不含最近數日訂單，與即時 SUM(order_items.quantity) 可能不同）
      return_count: 退貨次數（每日結算快照，不含最近數日，與即時 COUNT(order_returns) 可能不同）
      refund_total: 累計退款金額（快照）
      review_count: 評論則數（快照）
      avg_review_score: 平均給分（快照）
      browse_count: 瀏覽次數（快照）
      cart_abandon_count: 購物車放棄次數（每日結算快照，不含最近數日，與即時 COUNT(carts WHERE is_abandoned) 可能不同）
      coupon_used_count: 使用過的優惠券次數（每日結算快照，不含最近數日，與即時 COUNT(coupon_redemptions) 可能不同）
      email_opt_in: 是否同意 Email 行銷
      sms_opt_in: 是否同意簡訊行銷
      push_opt_in: 是否同意推播
      newsletter_opt_in: 是否訂閱電子報
      is_vip: 是否為 VIP
      is_blacklisted: 是否列入黑名單
      is_employee: 是否為員工帳號
      prefers_pickup: 是否偏好門市自取
      preferred_category: 偏好商品類別（行銷標記，非實際購買統計）
      preferred_payment_method: 偏好付款方式（行銷標記，非實際付款統計）
      preferred_delivery_window: 偏好收貨時段
      referral_source: 來源管道
      referred_by_customer_id: 推薦人的客戶ID
      consent_version: 同意條款版本，非業務欄位
      tier: 會員等級
      segment: 行銷分群
      lifecycle_stage: 生命週期階段
      churn_risk_score: 流失風險分數 0~1，越高越可能流失
      ltv_score: 預估終身價值分數
      engagement_score: 互動活躍度分數 0~1
      satisfaction_score: 滿意度分數 0~1，由評論與客服紀錄推估
      credit_limit: 信用額度
      loyalty_points: 目前紅利點數
      loyalty_tier_since: 目前會員等級的生效日
      risk_flag: 風控標記
      sync_version: 同步版本號，非業務欄位
    enums:
      gender:
        description: 性別
        values:
          F: ''
          M: ''
          OTHER: ''
      marital_status:
        description: 婚姻狀態
        arm: gap
        values:
          DIVORCED: ''
          MARRIED: ''
          SINGLE: ''
      referral_source:
        description: 來源管道
        values:
          AD: ''
          ORGANIC: ''
          REFERRAL: ''
          SOCIAL: ''
      tier:
        description: 會員等級
        values:
          BRONZE: ''
          GOLD: ''
          PLATINUM: ''
          SILVER: ''
      segment:
        description: 行銷分群
        values:
          AT_RISK: ''
          DORMANT: ''
          GROWING: ''
          LOYAL: ''
          NEW: ''
      lifecycle_stage:
        description: 生命週期階段
        arm: gap
        values:
          ACQUISITION: ''
          ACTIVATION: ''
          REACTIVATION: ''
          RETENTION: ''
      risk_flag:
        description: 風控標記
        values:
          NONE: 無風控標記
          WATCH: 觀察中
          HIGH: 高風險
        dead_ok:
          HIGH: '撐開發集 #159（expect: empty）—— 資料 0 筆是題目要的答案'
      preferred_language:
        description: 偏好語言
        values:
          en: ''
          zh-TW: ''
      preferred_delivery_window:
        description: 偏好收貨時段
        values:
          上午: ''
          下午: ''
          不指定: ''
          晚間: ''
  customers:
    clauses:
    - kind: content
      text: 客戶資訊表：一位客戶一列，記錄姓名、Email、電話、居住城市與註冊時間
      sep: 。
    - kind: bound
      text: 資料中存在同名不同人的客戶
      sep: ''
    columns:
      id: 客戶唯一ID
      name: 客戶姓名
      email: 客戶信箱
      phone: 客戶電話
      city: 居住城市
      created_at: 註冊時間
  delivery_attempts:
    clauses:
    - kind: content
      text: 配送嘗試紀錄：每一次上門派送留一筆，含撲空
      sep: 。
    - kind: content
      text: 最終是否送達看 shipments.status
      sep: ''
    columns:
      id: 派送紀錄唯一ID
      shipment_id: 所屬出貨單ID
      attempt_no: 第幾次嘗試
      result: 派送結果
      attempted_at: 派送時間
    enums:
      result:
        description: 派送結果
        values:
          ABSENT: ''
          DELIVERED: ''
          REFUSED: ''
  departments:
