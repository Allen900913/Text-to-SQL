# 寬表擴充計畫（宣告檔）—— 先宣告，再稽核，最後才建表
# =============================================================================
# 為什麼要做（ARCHITECTURE.md §2.6 §7 的前置條件）：
#
#   今天 80 張表裡只有 2 張超過 12 欄、1 張超過 30 欄，中位表寬 5 欄。
#   「欄位裁剪不用做」「欄位進檢索沒幫助」這兩個結論都是在這個 schema 上量的
#   —— 而它們正是要測「寬表」的結論。**靶子是空的**，跟當初干擾表全是零列時
#   量熱度先驗假性滿分是同一個病（§7.4）。
#
# 這份計畫要讓三個指標動起來，否則加了也白加：
#
#   >30 欄的表            1  →  7
#   p90 scoped DDL     4,114 → >10,000    （靠「一題同時選中兩張寬表」達成）
#   需要單表 5+ 非鍵欄位的題  0  →  ≥15    ← 最關鍵。光加表不配題，
#                                            eval_column_recall 還是會回 100%
#
# 硬約束（違反任何一條都會靜默毀掉既有 GT）：
#   1. 只 CREATE + INSERT，絕不重跑 db/init_db.py（會作廢 257 題 GT）
#   2. 亂數用專屬種子，不碰任何既有序列（同 RNG_LATE 的理由）
#   3. 建表後跑逐表 SHA 指紋，確認既有 80 張表一位元都沒動
#   4. 欄位名與註解不得命中防禦題探針 —— 見下方 probe_policy
#   5. 每張新表都要有 GT 題（閘門第 6 項會擋）
#
# 流程：
#   python tools/check_wide_table_plan.py     # 稽核這份宣告（還沒碰資料庫）
#   → 全綠才准建表

# =============================================================================
# 防禦題探針政策
# =============================================================================
# check_defence_gt.py 只對「沒有 acknowledged 的概念」報警，所以探針分兩級。
# 兩級都要避開，理由不同。
probe_policy:
  live:
    # 命中 → 閘門直接紅。這些字串不得出現在任何欄位名或欄位註解裡。
    why: 會讓 tools/check_defence_gt.py 報未裁決命中，閘門第 6 項紅燈
    strings: [運費, freight, shipping_fee, 郵資, 配送費, 物流費,
              利潤, 毛利, profit, margin,
              週轉, turnover, 在庫, 期初, 期末, inventory, on_hand,
              信用評分, credit_score, 信評, 徵信]
  acknowledged:
    # 命中**不會**報警（該概念已裁決）—— 這才是真陷阱：
    # 加了沒有人會喊，防禦題卻默默變得答得出來。
    why: 不報警但可能讓防禦題實質失效，判準是「業務定義在不在」（§6.2）
    strings: [庫存, stock, 容量, capacity, 成本, 進貨價, supply_price,
              手續費, fee_rate, credit, 額度, risk, 風險, 風控, score, 評分, 分數]
  # 除了字串比對，還有四條語意禁令（字串掃不到，要人守）：
  semantic_bans:
    - "不得出現「每個倉庫的在庫數量」這類欄位 —— 會讓 #140 實質可答，
       即使欄位名叫 qty_at_site 之類掃不到的名字"
    - "不得出現商品層級的成本／進價／利潤欄位 —— 會讓 #70 實質可答"
    - "不得在訂單層級出現任何運送費用，也不得出現「小計 vs 總額」的差額，
       否則模型會把差額當成運費（#68 要擋的正是「發明公式」）"
    - "不得出現客戶層級的綜合信用分數 —— 會讓 #141 實質可答"

# =============================================================================
# 六張寬表
# =============================================================================
# 每張 1:1 掛在既有主體上（沿用 customer_profiles 已驗證安全的模式）。
# table_comment 刻意只寫 3~4 個概念群 —— 那是 §2.5 量到的容量上限，
# 寫滿 5 群反而會讓它在不相干的題目上到處排第一。
# **這正是要測的現象之一**：概念群塞不下的那一群，會不會變成檢索盲區。

tables:

  # ---------------------------------------------------------------- 1
  product_profiles:
    attach: {to: products, fk: product_id, cardinality: "1:1"}
    table_comment: >-
      商品內容檔案寬表：商品的上架狀態與生命週期、多語系名稱與行銷文案、
      SEO 與圖片內容完整度、包裝與運送限制、法規合規與認證。
      這是內容與合規面，商品的品名售價在 products，實體規格在 product_specs。
    concept_groups: [上架與生命週期, 多語系與文案, SEO與內容完整度, 包裝與運送限制, 法規合規]
    columns:
      - {name: id, type: INT AUTO_INCREMENT PRIMARY KEY, comment: 流水號}
      - {name: product_id, type: INT, comment: 對應的商品}
      - {name: lifecycle_stage, type: VARCHAR(20), comment: "生命週期：NEW 新品／GROWTH 成長／MATURE 成熟／EOL 停產"}
      - {name: listed_at, type: DATETIME, comment: 首次上架時間}
      - {name: delisted_at, type: DATETIME, comment: 下架時間，NULL 表示仍在架上}
      - {name: is_published, type: TINYINT, comment: 是否對外顯示，0 表示隱藏中}
      - {name: is_searchable, type: TINYINT, comment: 是否允許站內搜尋找到}
      - {name: is_giftable, type: TINYINT, comment: 是否可指定為禮物贈送}
      - {name: is_preorder, type: TINYINT, comment: 是否為預購商品}
      - {name: preorder_ship_date, type: DATE, comment: 預購商品的預計出貨日}
      - {name: name_en, type: VARCHAR(120), comment: 英文品名}
      - {name: name_ja, type: VARCHAR(120), comment: 日文品名}
      - {name: short_copy, type: VARCHAR(200), comment: 一句話行銷短文案}
      - {name: long_copy, type: TEXT, comment: 完整商品介紹文案}
      - {name: selling_points, type: VARCHAR(255), comment: 賣點條列，以分號分隔}
      - {name: target_audience, type: VARCHAR(60), comment: "目標客群描述，例如：學生族／通勤族"}
      - {name: usage_scenario, type: VARCHAR(120), comment: 建議使用情境}
      - {name: care_instructions, type: VARCHAR(255), comment: 保養與清潔說明}
      - {name: seo_title, type: VARCHAR(120), comment: SEO 標題}
      - {name: seo_description, type: VARCHAR(255), comment: SEO 描述}
      - {name: seo_keywords, type: VARCHAR(200), comment: SEO 關鍵字，以逗號分隔}
      - {name: canonical_url, type: VARCHAR(200), comment: 正規化網址}
      - {name: image_count, type: INT, comment: "商品頁圖片張數，內容維護登記的快照，與 product_images 的實際列數可能不同"}
      - {name: has_video, type: TINYINT, comment: 是否有商品影片}
      - {name: has_size_chart, type: TINYINT, comment: 是否附尺寸對照表}
      - {name: has_manual_pdf, type: TINYINT, comment: 是否附電子說明書}
      - {name: content_completeness, type: INT, comment: 內容完整度百分比，由必填欄位填寫比例計算}
      - {name: content_updated_at, type: DATETIME, comment: 內容最後更新時間}
      - {name: content_owner, type: VARCHAR(40), comment: 內容維護負責人}
      - {name: translation_status, type: VARCHAR(20), comment: "翻譯狀態：NONE 未翻／PARTIAL 部分／DONE 完成"}
      - {name: package_type, type: VARCHAR(20), comment: "包裝型式：BOX 紙盒／BAG 軟袋／PALLET 棧板"}
      - {name: package_length_cm, type: "DECIMAL(6,1)", comment: 外包裝長度（公分）}
      - {name: package_width_cm, type: "DECIMAL(6,1)", comment: 外包裝寬度（公分）}
      - {name: package_height_cm, type: "DECIMAL(6,1)", comment: 外包裝高度（公分）}
      - {name: package_weight_g, type: INT, comment: 含包裝的總重量（公克）}
      - {name: is_fragile, type: TINYINT, comment: 是否易碎品}
      - {name: needs_cold_chain, type: TINYINT, comment: 是否需要冷鏈配送}
      - {name: is_air_restricted, type: TINYINT, comment: 是否禁止空運}
      - {name: is_oversized, type: TINYINT, comment: 是否為大型件，需特殊配送安排}
      - {name: hazard_class, type: VARCHAR(20), comment: 危險品分類，NONE 表示非危險品}
      - {name: origin_certified, type: TINYINT, comment: 是否有產地證明}
      - {name: safety_cert_no, type: VARCHAR(40), comment: 安全認證字號}
      - {name: safety_cert_expiry, type: DATE, comment: 安全認證到期日}
      - {name: energy_label, type: VARCHAR(10), comment: "能源效率標示等級：1~5 級"}
      - {name: recyclable_code, type: VARCHAR(10), comment: 回收材質代碼}
      - {name: is_restricted_age, type: TINYINT, comment: 是否有年齡購買限制}
      - {name: compliance_note, type: VARCHAR(255), comment: 法規備註}
      - {name: compliance_checked_at, type: DATE, comment: 最近一次合規檢核日期}
      - {name: warranty_policy, type: VARCHAR(120), comment: 保固政策說明文字}
      - {name: return_policy_days, type: INT, comment: 可退貨天數}
      - {name: is_return_exempt, type: TINYINT, comment: 是否屬於不可退換的品項}
      - {name: created_at, type: DATETIME, comment: 建檔時間}

  # ---------------------------------------------------------------- 2
  order_profiles:
    attach: {to: orders, fk: order_id, cardinality: "1:1"}
    # 「風控人工覆核」是 2026-08-22 補的：check_comment_coverage.py 指出
    # fraud_review_* 四個欄位的概念在表註解裡完全不存在，而 #263 正是 8/8 全錯
    # （5 次誤觸防禦暗號）。補法刻意是**壓縮不是追加** —— 併進既有的「客服接觸」
    # 子句，註解只長 5 個字。同時量過「17 個缺口全補」的版本：買到的一樣
    # （#263 排名都是 1），代價是 @5 −1.8pp、27 題排名退步（§2.5 的容量上限）。
    table_comment: >-
      訂單情境檔案寬表：下單的通路與裝置、流量來源與行銷歸因、
      結帳過程與付款情境、收件偏好與包裝指示、客服接觸與風控人工覆核。
      這是「這張訂單是怎麼來的」，訂單金額與狀態在 orders。
    concept_groups: [通路與裝置, 流量來源歸因, 結帳過程, 收件與包裝偏好, 客服接觸]
    # ⚠️ 刻意不含任何運送費用欄位，也不含小計／稅額 —— 見 probe_policy.semantic_bans
    columns:
      - {name: id, type: INT AUTO_INCREMENT PRIMARY KEY, comment: 流水號}
      - {name: order_id, type: INT, comment: 對應的訂單}
      - {name: channel, type: VARCHAR(20), comment: "下單通路：WEB 官網／APP 行動應用／PHONE 電話／STORE 門市"}
      - {name: device_type, type: VARCHAR(20), comment: "裝置類型：DESKTOP／MOBILE／TABLET"}
      - {name: os_name, type: VARCHAR(20), comment: 作業系統名稱}
      - {name: browser_name, type: VARCHAR(20), comment: 瀏覽器名稱}
      - {name: app_version, type: VARCHAR(20), comment: 行動應用版本，網頁下單為 NULL}
      - {name: screen_size, type: VARCHAR(20), comment: 螢幕解析度}
      - {name: ip_country, type: VARCHAR(10), comment: 下單時的 IP 所在國別}
      - {name: utm_source, type: VARCHAR(40), comment: 流量來源，例如 google／facebook／direct}
      - {name: utm_medium, type: VARCHAR(40), comment: "流量媒介：cpc 付費點擊／organic 自然／email 電子報"}
      - {name: utm_campaign, type: VARCHAR(60), comment: "歸因到的行銷活動代號，格式 CMP-NN，NN 是 campaigns.id 補零成兩位"}
      - {name: referrer_domain, type: VARCHAR(80), comment: 導流來源網域}
      - {name: landing_page, type: VARCHAR(160), comment: 進站的第一個頁面}
      - {name: is_first_order, type: TINYINT, comment: 是否為該客戶的首張訂單}
      - {name: is_guest_checkout, type: TINYINT, comment: 是否以訪客身分結帳，未登入}
      - {name: session_minutes, type: INT, comment: 本次造訪從進站到送出訂單的分鐘數}
      - {name: pages_viewed, type: INT, comment: 本次造訪瀏覽的頁面數}
      - {name: cart_edit_count, type: INT, comment: 送出前修改購物車的次數}
      - {name: checkout_seconds, type: INT, comment: 結帳頁停留到送出的秒數}
      - {name: checkout_attempts, type: INT, comment: 結帳送出的嘗試次數，含失敗}
      - {name: coupon_tried_count, type: INT, comment: 嘗試輸入優惠券碼的次數}
      - {name: is_split_payment, type: TINYINT, comment: 是否分多筆付款完成}
      - {name: installment_periods, type: INT, comment: 分期期數，0 表示一次付清}
      - {name: currency_code, type: VARCHAR(10), comment: 結帳幣別}
      - {name: exchange_rate, type: "DECIMAL(10,4)", comment: 結帳當下的匯率}
      - {name: invoice_type, type: VARCHAR(20), comment: "發票類型：PERSONAL 個人／COMPANY 公司／DONATE 捐贈"}
      - {name: invoice_carrier, type: VARCHAR(40), comment: 電子發票載具號碼}
      - {name: tax_id_used, type: VARCHAR(20), comment: 開立公司發票時使用的統一編號}
      - {name: delivery_preference, type: VARCHAR(20), comment: "配送偏好：HOME 宅配／STORE 門市取貨／LOCKER 智取櫃"}
      - {name: preferred_time_slot, type: VARCHAR(20), comment: "希望送達時段：MORNING／AFTERNOON／EVENING／ANY"}
      - {name: delivery_note, type: VARCHAR(200), comment: 客戶填寫的配送備註}
      - {name: is_gift_wrap, type: TINYINT, comment: 是否加購禮物包裝}
      - {name: gift_message, type: VARCHAR(200), comment: 禮物卡片留言}
      - {name: hide_price_on_slip, type: TINYINT, comment: 是否隱藏出貨單上的金額}
      - {name: signature_required, type: TINYINT, comment: 是否必須本人簽收}
      - {name: contact_before_delivery, type: TINYINT, comment: 是否要求送達前先電聯}
      - {name: support_contact_count, type: INT, comment: 這張訂單客戶聯繫客服的次數}
      - {name: first_support_at, type: DATETIME, comment: 首次聯繫客服的時間}
      - {name: has_complaint, type: TINYINT, comment: 是否留下客訴紀錄}
      - {name: satisfaction_survey_sent, type: TINYINT, comment: 是否已寄出滿意度問卷}
      - {name: survey_responded_at, type: DATETIME, comment: 客戶回覆問卷的時間}
      - {name: fraud_review_required, type: TINYINT, comment: 是否被系統標記需人工覆核}
      - {name: fraud_review_result, type: VARCHAR(20), comment: "覆核結果：PASS 放行／HOLD 暫扣／REJECT 婉拒"}
      - {name: reviewed_by, type: VARCHAR(40), comment: 執行覆核的人員}
      - {name: reviewed_at, type: DATETIME, comment: 覆核完成時間}
      - {name: created_at, type: DATETIME, comment: 建檔時間}

  # ---------------------------------------------------------------- 3
  employee_profiles:
    attach: {to: employees, fk: employee_id, cardinality: "1:1"}
    table_comment: >-
      員工人資檔案寬表：雇用型態與職級異動、工作地點與遠端安排、
      學歷語言與證照、教育訓練與年度考核等第、特休時數與緊急聯絡人。
      這是人資檔案，員工的姓名職稱在 employees，排班在 employee_shifts。
    concept_groups: [雇用與職級, 工作地點與遠端, 學歷語言證照, 訓練與考核, 休假與緊急聯絡]
    # ⚠️ 考核用「等第 A/B/C」不用分數 —— 避開 #141 的 score/分數/評分
    columns:
      - {name: id, type: INT AUTO_INCREMENT PRIMARY KEY, comment: 流水號}
      - {name: employee_id, type: INT, comment: 對應的員工}
      - {name: employment_type, type: VARCHAR(20), comment: "雇用型態：FULLTIME 正職／PARTTIME 兼職／CONTRACT 約聘／INTERN 實習"}
