# =============================================================================
# GT 題目計畫
# =============================================================================
# 三種角色，缺任何一種這次擴充就白做：
#
#   multi_col  需要單表 5+ 個非鍵欄位 —— 逼 eval_column_recall 的 K=4 破功。
#              今天 248 題**一題都沒有**，所以 K=4 永遠回 100%。
#   two_wide   一題同時需要兩張寬表 —— 把 p90 scoped DDL 推過 10,000。
#   discrim    概念藏在寬表欄位裡、表註解塞不下（#154 的形狀）——
#              測 §2.5 的「一張表一句註解」容量上限。
#
# 刻意讓 discrim 題目的關鍵詞**不在 table_comment 裡**（在 concept_groups
# 的第 5 群，也就是被容量上限擠掉的那一群）—— 那正是要量的東西。

questions:
  # phrasing: terse   條列式、schema 關鍵詞密度高（今天 257 題大多是這種）
  #           spoken  業務口語、有贅字與間接指稱、關鍵詞被稀釋
  # 刻意各半。口語化會**降低問句裡的 schema 訊號密度**，那正是真實使用者的樣子，
  # 也正好是檢索最吃力的條件 —— 只配 terse 題會把難度調低。

  - {table: product_profiles, roles: [multi_col], phrasing: terse,
     q: "列出所有已停產商品的品名、英文品名、下架時間、內容維護負責人與可退貨天數。"}
  - {table: product_profiles, roles: [multi_col, discrim], phrasing: spoken,
     q: "有些東西是不能走空運的，這類商品我想看一下它們的危險品分類、外箱長寬高跟含包裝的重量，幫我整理出來。"}
  - {table: product_profiles, roles: [discrim], phrasing: spoken,
     q: "有沒有商品的安全認證其實已經過期了？我怕有合規風險。"}
  - {table: product_profiles, roles: [multi_col], phrasing: terse,
     q: "內容完整度低於 60% 的商品，內容檔案上登記的圖片張數、是否有影片、是否附說明書與翻譯狀態各是什麼？"}

  - {table: order_profiles, roles: [multi_col], phrasing: terse,
     q: "列出所有以行動應用下單的訂單，含裝置類型、作業系統、應用版本與結帳耗時秒數。"}
  - {table: order_profiles, roles: [multi_col, discrim], phrasing: spoken,
     q: "那些被系統擋下來說要人工看過的單子，最後審的結果是什麼？誰審的、什麼時候審的、客人有沒有抱怨？"}
  - {table: order_profiles, roles: [discrim], phrasing: spoken,
     q: "有多少客人下單的時候有特別交代說送到之前要先打電話給他？"}
  - {table: order_profiles, roles: [multi_col], phrasing: terse,
     q: "訪客結帳的訂單，其流量來源、媒介、導流網域與落地頁分別是什麼？"}

  - {table: employee_profiles, roles: [multi_col], phrasing: spoken,
     q: "我想知道哪些同事是完全在家上班的，順便看一下他們一週可以遠端幾天、人在哪個城市、時區跟聘僱方式。"}
  - {table: employee_profiles, roles: [multi_col, discrim], phrasing: spoken,
     q: "今年教育訓練時數還沒補齊的同仁有哪些？我要看他們上了幾小時、規定要幾小時、上次上課是什麼時候，還有職安訓練什麼時候到期。"}
  - {table: employee_profiles, roles: [discrim], phrasing: terse,
     q: "最近一次年度考核等第是 A 的員工有哪些？"}

  - {table: store_profiles, roles: [multi_col], phrasing: spoken,
     q: "禮拜天不開的店有哪些？順便告訴我它們在哪一區、店多大、離最近的捷運站走路要幾分鐘。"}
  - {table: store_profiles, roles: [multi_col, discrim], phrasing: spoken,
     q: "我想找那種維修、安裝、舊機換購三種服務都有做的門市，這些店的服務櫃檯有幾個？有沒有無障礙？"}
  - {table: store_profiles, roles: [discrim], phrasing: spoken,
     q: "有沒有哪幾家店的消防安檢快到期了？今年年底前會過期的那種。"}

  - {table: supplier_profiles, roles: [multi_col], phrasing: terse,
     q: "列出準時交貨率低於 90% 的供應商，含不良品率、品質等第、承諾交期天數與尚未結案的稽核缺失數。"}
  - {table: supplier_profiles, roles: [discrim], phrasing: spoken,
     q: "我們現在有跟哪幾家廠商停止往來嗎？為什麼停？"}

  - {table: campaign_profiles, roles: [multi_col], phrasing: terse,
     q: "列出每一檔活動的總預算、實際花費、花費進度、曝光數、點擊數與點擊率。"}
  - {table: campaign_profiles, roles: [multi_col, discrim], phrasing: spoken,
     q: "有哪幾檔廣告後來被停掉了？為什麼停、當初是誰核准的、什麼時候核的、已經花掉多少錢？"}

