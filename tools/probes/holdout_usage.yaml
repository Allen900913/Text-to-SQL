# 用途句（usage）的保留組 —— 全新問句，三分組
#
# 為什麼要這一組
# ────────────────────────────────────────────────────────────────────
# 用途句是**除錯機制**：出身寫在 gen_table_docs.py 的 docstring 裡 ——
# 145 題 K=3 召回 85.6%，失敗的 20 題有 19 題漏同一張 order_items，
# 因為「問題用動詞、文件寫名詞」。它是為了補那個詞彙落差而寫的。
#
# 而它的分佈支持「貼題」的懷疑：
#     usage 那 9 張表   GT 被需要次數 中位數 6、平均 16.9
#     其餘 84 張                      中位數 2、平均  4.0
#     GT 最熱的 10 張表裡有 4 張帶 usage
#
# 305 題上量到的效果也是混的：
#     含字面詞（營收 / 備貨天數）  5 題  拿掉退步 +34.0   ← 過擬合成分
#     不含字面詞                29 題  拿掉退步  +3.2   ← 真的遷移
#
# D+ 的教訓：305 題上很硬的介入，換成新問句只剩 1/5。用途句從沒被保留組測過。
#
# 出題規則
# ────────────────────────────────────────────────────────────────────
#   · 全新問句，不在 eval_questions_v2.json
#   · **刻意避開用途句的字面詞**（營收／客單價／熱賣排行／銷售佔比／
#     到貨天數／備貨天數／原因分布／未退成／輪廓／分級／分群）——
#     抄了就只是在量字面比對
#   · 每題只登記非有不可的那張表
#
# 判準：**跑完 A 臂基線之後才登記**（見 criteria-need-headroom 的教訓：
# 上一組寫「增加 >= 3」而基線已經 4/5，門檻不可能達成）。

groups:

  # ── U1：需要 usage 表，問法用商業動詞（用途句的目標形狀）────────────
  # 這是用途句該起作用的地方。它若不遷移，這一組會塌。
  U1:
    - q: 每個品項一共出去了幾件？
      want: order_items
    - q: 哪一類的東西替我們賺進最多錢？
      want: order_items
    - q: 一張單子平均花掉客人多少？
      want: orders
    - q: 這筆錢是用哪一種方式收進來的？
      want: payments
    - q: 總共有多少錢退回給客人了？
      want: refunds
    - q: 東西從出倉到客人手上要花幾天？
      want: shipments
    - q: 跟廠商叫貨大概要等多久才會到？
      want: product_suppliers
    - q: 這一波活動總共讓利掉多少？
      want: order_promotions
    - q: 哪一座倉出的貨最多？
      want: warehouses

  # ── U2：需要 usage 表，但問法是實體名詞（content 就夠了）───────────
  # 用途句補的是「動詞 vs 名詞」的落差，所以這一組理論上不該依賴它。
  # 它是 U1 的機制對照：若 U1 塌而 U2 不塌，落差假說成立。
  U2:
    - q: 一張訂單裡面有哪幾個商品項目？
      want: order_items
    - q: 這張訂單對應到哪一筆付款紀錄？
      want: payments
    - q: 這張訂單的出貨單是哪一張？
      want: shipments
    - q: 目前有哪些退款申請單？
      want: refunds
    - q: 公司總共有哪幾座倉庫？
      want: warehouses

  # ── U3：不需要 usage 表的窄表題（誘餌端）──────────────────────────
  # usage 表是 GT 最熱的那幾張，最有本錢到處搶第一。實測拿掉用途句之後
  # 寬表搶 Top-1 從 24 升到 28 —— 方向是「用途句反而壓住了誤選」。
  # 這一組專門盯那個方向：拿掉之後這些題會不會被 orders / order_items 搶走。
  U3:
    - q: 客人把哪些東西放進購物車了？
      want: cart_items
    - q: 客人看過哪些商品頁面？
      want: browse_logs
    - q: 有哪些東西被收進願望清單？
      want: wishlist_items
    - q: 商品總共分成哪幾類？
      want: categories
    - q: 倉庫之間互相調了哪些貨？
      want: warehouse_transfers
