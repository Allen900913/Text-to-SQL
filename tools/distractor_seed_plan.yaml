    **設計為永不作答**：系統稽核軌跡，分析師不會問。
    與 customer_login_logs 同一組稀釋律樣本（§10.2）。
  values:
    action: [INSERT, UPDATE, DELETE]

schema_migrations:
  never_answered: true
